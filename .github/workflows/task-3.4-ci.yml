name: Sprint 3 - Task 3.4 Target Selection & Data Splitting CI

on:
  push:
    paths:
      - 'Sprint 3/Task-3.4_Shreyas_Target-Selection-and-Data-Splitting/**'
      - '.github/workflows/task-3.4-ci.yml'
  pull_request:
    paths:
      - 'Sprint 3/Task-3.4_Shreyas_Target-Selection-and-Data-Splitting/**'

jobs:
  backend-validation:
    name: Backend Unit Tests (STP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sprint 3/Task-3.4_Shreyas_Target-Selection-and-Data-Splitting/backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Task 3.4 Unit Tests
        run: python -m unittest discover -s . -p "test_*.py"

  frontend-validation:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sprint 3/Task-3.4_Shreyas_Target-Selection-and-Data-Splitting/frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set Up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm install

      - name: Verify Build
        run: npm run build